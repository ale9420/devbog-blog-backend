services:
  strapi:
    image: ghcr.io/${GITHUB_REPOSITORY:-devbog-blog-backend}:latest
    build:
      context: .
      target: production
    restart: unless-stopped
    ports:
      - '${PORT:-1337}:1337'
    env_file:
      - .env
    environment:
      DATABASE_CLIENT: ${DATABASE_CLIENT:-postgres}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-strapi}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-strapi}
      DATABASE_SSL: ${DATABASE_SSL:-false}
    volumes:
      - strapi-tmp:/app/.tmp
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The image is Alpine: busybox wget, no curl (same probe as the Dockerfile).
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:1337/_health']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  db:
    # Same major as production (bogdev-prod, see CLAUDE.md). From 18 the image
    # keeps its data under /var/lib/postgresql/<major>, so the volume mounts the
    # parent; a volume created by postgres:16 needs a dump and restore.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-strapi}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi}
    volumes:
      - strapi-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME:-strapi} -d ${DATABASE_NAME:-strapi}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  strapi-tmp:
    driver: local
  strapi-db-data:
    driver: local
