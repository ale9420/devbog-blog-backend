name: Toggle Staging

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Start or stop the staging app'
        required: true
        type: choice
        options:
          - start
          - stop

permissions: {}

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      # Values go through env, not inline `${{ }}` in the script, so nothing is
      # interpolated into the shell.
      - name: Call Dokploy application.${{ inputs.action }}
        env:
          ACTION: ${{ inputs.action }}
          DOKPLOY_SERVER_URL: ${{ secrets.DOKPLOY_SERVER_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_STAGING_APPLICATION_ID }}
        run: |
          curl -fsS -X POST "${DOKPLOY_SERVER_URL%/}/api/application.${ACTION}" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${DOKPLOY_APPLICATION_ID}\"}"
